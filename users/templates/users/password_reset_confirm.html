<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Set New Password - LoanArchive</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}body{background:#f3f6fb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:32px 28px;box-shadow:0 20px 60px rgba(30,74,138,.12)}h2{font-size:22px;margin-bottom:8px}label{font-size:12px;font-weight:700}input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 12px;font-size:14px}.btn{width:100%;padding:13px;background:#1e4a8a;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer}.err{color:#dc2626;font-size:13px;margin-bottom:12px}p{font-size:14px;color:#6b7280;line-height:1.5}</style>
</head><body><div class="card">{% if validlink %}<h2>Set new password</h2><form method="post">{% csrf_token %}<label>New password</label><input type="password" name="new_password1" required><label>Confirm new password</label><input type="password" name="new_password2" required>{% if form.errors %}<div class="err">{{ form.errors }}</div>{% endif %}<button class="btn">Reset Password</button></form>{% else %}<h2>Link expired</h2><p>This reset link is invalid or already used. Please request a new one.</p><a href="{% url 'users:password_reset' %}" style="color:#1e4a8a;font-weight:700;">Request new link →</a>{% endif %}</div></body></html>
