services:
    - type: web
    name: loanarchive
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn LoanArchive.wsgi:application"
    envVars:
            - key: PYTHON_VERSION
        value: 3.11.0
            - key: DEBUG
        value: False
