<div class="border rounded p-3 d-flex flex-row align-items-center gap-2" style="background:#f8f9fa; display:flex; flex-direction:row; align-items:center; gap:8px; border:1px solid #dee2e6; border-radius:8px; padding:12px; background:#f8f9fa; margin-bottom:16px;">
  <div style="font-weight:700;">Actions:</div>
  <div style="position:relative;" id="actionsDropdown">
    <button type="button" onclick="toggleActions()" style="background:#e9ecef; border:1px solid #dee2e6; border-radius:6px; padding:6px 12px; font-weight:500; cursor:pointer;">
      Enter payments ▾
    </button>
    <div id="placementMenu" style="display:none; position:absolute; top:110%; left:0; background:white; border:1px solid #dee2e6; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.1); min-width:190px; z-index:9999; overflow:hidden;">
      <a href="{% url 'transactions:repayments_page' %}" style="display:block; padding:10px 14px; background:#1e4a8a; color:white; text-decoration:none; font-weight:600;">Enter payments</a>
      <a href="/view-payments/" style="display:block; padding:10px 14px; color:#212529; text-decoration:none;">View Payments</a>
      <a href="/edit-payments/" style="display:block; padding:10px 14px; color:#212529; text-decoration:none;">Edit Payments</a>
      <a href="/reverse-payments/" style="display:block; padding:10px 14px; color:#212529; text-decoration:none;">Reverse Payments</a>
    </div>
  </div>
</div>
{% block extra-js %}
<script>
function toggleActions(){
  const m = document.getElementById('placementMenu');
  m.style.display = m.style.display === 'none' || m.style.display === '' ? 'block' : 'none';
}
document.addEventListener('click', function(e){
  const wrap = document.getElementById('actionsDropdown');
  if(wrap && !wrap.contains(e.target)){
    document.getElementById('placementMenu').style.display = 'none';
  }
});
</script>
{% endblock extra-js %}
