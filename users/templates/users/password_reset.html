<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot Password - LoanArchive</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}body{background:#f3f6fb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:32px 28px;box-shadow:0 20px 60px rgba(30,74,138,.12)}h2{font-size:22px;margin-bottom:8px}.sub{font-size:13px;color:#6b7280;line-height:1.5;margin-bottom:20px}label{font-size:12px;font-weight:700}input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 16px;font-size:14px}.btn{width:100%;padding:13px;background:#1e4a8a;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer}.back{display:block;text-align:center;margin-top:16px;color:#1e4a8a;font-size:13px;font-weight:600;text-decoration:none}</style>
</head><body><div class="card"><h2>Forgot password?</h2><p class="sub">Enter your account email and we'll send you a link to reset it.</p><form method="post">{% csrf_token %}<label>Email address</label><input type="email" name="email" required placeholder="you@example.com"><button class="btn">Send Reset Link</button></form><a class="back" href="{% url 'users:login' %}">← Back to Login</a></div></body></html>
